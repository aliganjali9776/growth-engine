services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: growth_engine_dev
      POSTGRES_USER: growth_engine_dev
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - growth_engine_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_engine_dev -d growth_engine_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  growth_engine_dev_data:
